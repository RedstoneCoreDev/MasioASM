<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="100%" height="80">
  <defs>
    <!-- Gradient for ASM text -->
    <linearGradient id="asmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <style>
    .brand-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #f8fafc;
    }
    .brand-accent {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: url(#asmGradient);
    }
  </style>

  <!-- Logo Content -->
  <text x="10" y="55">
    <tspan class="brand-main">Masio</tspan>
    <tspan class="brand-accent">ASM</tspan>
  </text>
</svg>